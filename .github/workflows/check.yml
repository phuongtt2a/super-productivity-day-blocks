name: Check Day Blocks plugin
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: day-blocks-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin and package
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/package.py
          node --check plugin/plugin.js
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0 Pillow
          python -m playwright install --with-deps chromium
      - name: Test planned sessions, habits, multi-block links, drag and mobile
        run: python tests/browser_planner_check.py
      - name: Refresh documentation screenshots
        run: python scripts/capture_screenshots.py
      - name: Upload installable preview and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-blocks-preview
          path: |
            dist/day-blocks-super-productivity.zip
            docs/screenshots/*.webp
          if-no-files-found: warn
      - name: Keep preview screenshots with the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: update Day Blocks timeline screenshots"
            git push origin "HEAD:$BRANCH"
          fi
